<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Reporte LaTiNa y Centenaria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: hoja A4 centrada sobre gris; una barra de herramientas arriba que no se imprime */
:root{
  --ink:#141416; --ink2:#3A3B40; --muted:#6B6D74; --line:#E4E4E7; --soft:#F3F3F4;
  --accent:#141416; --deep:#0B0B0C; --gold:#E9BE00;
  --cente:#6B5600; --cente-bg:#FFF4C2; --latina:#0C5223; --latina-bg:#DDEFE2; --azul:#0B2F63; --azul-bg:#E1E9F5;
  --ok:#1F7A3A; --ok-bg:#E1F2E6; --wait:#A8460F; --wait-bg:#FDEBDD; --bad:#B42318;
  --font:"Montserrat",system-ui,sans-serif; color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:#DCDCDF;color:var(--ink);font:10pt/1.5 var(--font);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tools{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:10px 16px}
.tools button,.tools a{font:600 13px var(--font);border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:8px;padding:7px 13px;cursor:pointer;text-decoration:none}
.tools button.on{background:#fff;color:var(--deep)}
.tools .pdf{background:var(--gold);border-color:var(--gold);color:var(--deep)}
.tools .per{font:700 13px var(--font);min-width:15em;text-align:center}
.hoja{width:210mm;min-height:297mm;margin:18px auto 40px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.15);display:flex;flex-direction:column}
.cab{background:linear-gradient(120deg,#0B0B0C 0%,#1C1C1F 70%,#2C2D31 100%);color:#fff;padding:14mm 14mm 11mm;display:grid;gap:8mm}
.cab .top{display:flex;justify-content:space-between;align-items:center}
.cab .mk{display:flex;gap:10px;align-items:center;font-weight:700;font-size:10pt}
.cab .mk img{height:34px;width:auto;display:block}
.cab .lbl{font-size:8pt;letter-spacing:.12em;text-transform:uppercase;color:#A9ABB1;font-weight:600}
.cab h1{margin:3mm 0 0;font-size:25pt;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.cab .per{font-size:12pt;color:#E4E4E7;margin-top:2mm;font-weight:500}
.cuerpo{padding:9mm 14mm 10mm;display:grid;gap:8mm;flex:1;align-content:start}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:4mm;margin-top:-17mm}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:4mm;box-shadow:0 4px 14px rgba(0,0,0,.08)}
.kpi .l{font-size:7.5pt;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-size:19pt;font-weight:800;letter-spacing:-.03em;margin-top:1mm;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:10pt;color:var(--muted);font-weight:600}
.kpi .d{font-size:8pt;color:var(--muted)}
section{display:grid;gap:3mm;break-inside:avoid;align-content:start}
h2{margin:0;font-size:12.5pt;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:8.8pt}
th{text-align:left;font-size:7.3pt;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2mm 2mm;border-bottom:1.5px solid var(--ink)}
td{padding:2.2mm 2mm;border-bottom:1px solid var(--line);vertical-align:top}
tr{break-inside:avoid}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tot td{font-weight:800;border-bottom:0;border-top:1.5px solid var(--ink)}
.m{display:inline-block;font-size:7.5pt;font-weight:700;padding:.5mm 2mm;border-radius:99px;white-space:nowrap}
.m.centenaria{color:var(--cente);background:var(--cente-bg)} .m.latina{color:var(--latina);background:var(--latina-bg)} .m.cente-azul{color:var(--azul);background:var(--azul-bg)}
.e{font-size:7.5pt;font-weight:700;padding:.5mm 2mm;border-radius:99px;background:var(--soft);color:var(--ink2);white-space:nowrap}
.e.publicado{background:var(--ok-bg);color:var(--ok)} .e.pendiente{background:var(--wait-bg);color:var(--wait)}
.muted{color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6mm}
.lista{margin:0;padding:0;list-style:none;display:grid;gap:1.6mm}
.lista li{display:grid;grid-template-columns:4mm 1fr;gap:1mm;font-size:9pt}
.lista li::before{content:"";width:1.6mm;height:1.6mm;border-radius:50%;background:var(--accent);margin-top:1.8mm}
.grp{font-size:7.5pt;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:1.5mm}
.pedido{background:#FFF8F2;border:1px solid #F3D3BA;border-radius:10px;padding:4mm 5mm;display:grid;gap:2mm}
.pedido h2::before{background:var(--wait)}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font);fill:var(--muted);font-size:10px}
.chart .grid{stroke:var(--line)}
.chart .b{fill:var(--accent)}
.chart .vl{fill:var(--ink2);font-weight:700}
.spark{width:24mm;height:7mm;display:block}
.delta{font-weight:700} .delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
.pie{padding:5mm 14mm;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-size:7.5pt;color:var(--muted)}
.vacio{color:var(--muted);font-size:9pt;font-style:italic}
.cargando{text-align:center;padding:40mm 0;color:var(--muted)}
@page{size:A4;margin:0}
@media print{
  body{background:#fff}
  .tools{display:none}
  .hoja{margin:0;box-shadow:none;width:auto;min-height:297mm}
}
@media (max-width:820px){.hoja{width:auto;margin:0;min-height:0}.kpis{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="tools">
  <a href="/">← Panel</a>
  <button id="b-semana">Semana</button><button id="b-mes">Mes</button>
  <button id="prev" aria-label="Período anterior">‹</button><span class="per" id="per">…</span><button id="next" aria-label="Período siguiente">›</button>
  <button class="pdf" id="pdf">Descargar PDF</button>
</div>
<div class="hoja" id="hoja"><p class="cargando">Armando el reporte…</p></div>

<script src="/reporte.js"></script>
</body>
</html>
