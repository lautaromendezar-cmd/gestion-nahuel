<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B0C">
<title>Redes Latina | Centenaria</title>
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
/* Layout: menú lateral negro fijo + área de trabajo gris clara; en el celular el menú pasa a una barra superior con navegación deslizable.
   El color está en las marcas (etiquetas Centenaria/LaTiNa/Cente Azul) y en los estados; lo demás es negro y gris. */
:root{
  --bg:#F3F3F4; --surface:#FFFFFF; --sunk:#EEEEF0; --fg:#141416; --fg2:#3A3B40; --muted:#6B6D74; --line:#E4E4E7;
  --accent:#141416; --accent-2:#2C2D31; --accent-soft:#E9E9EC; --accent-fg:#FFFFFF;
  --side:#0B0B0C; --side-fg:#C8C9CD; --side-muted:#85878E; --side-hover:#1C1C1F;
  --cente:#6B5600; --cente-bg:#FFF4C2; --cente-dot:#E9BE00;
  --latina:#0C5223; --latina-bg:#DDEFE2; --latina-dot:#1E8A44;
  --azul:#0B2F63; --azul-bg:#E1E9F5; --azul-dot:#2D6BC4;
  --wait:#A8460F; --wait-bg:#FDEBDD; --ok:#1F7A3A; --ok-bg:#E1F2E6; --doing:#1B5C8F; --doing-bg:#E0ECF7; --bad:#B42318; --bad-bg:#FDE7E5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--font)}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;text-wrap:balance;line-height:1.15}
h1{font-size:24px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* esqueleto */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 252px,transparent 252px)}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;gap:18px;overflow-y:auto}
.brand{display:grid;gap:10px;padding:0 8px}
.logos{display:flex;align-items:center;gap:10px}
.logos img{height:44px;width:auto;display:block}
.brand b{display:block;color:#fff;font-size:14px;letter-spacing:-.01em;line-height:1.3}
.brand b span{color:var(--side-muted);font-weight:500}
.navgrp{display:grid;gap:2px}
.navgrp .gl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:6px 10px}
.nav{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--side-fg);padding:9px 10px;border-radius:9px;font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--side-hover)}
.nav[aria-current="page"]{background:#fff;color:var(--side);font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .bd{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 7px}
.nav .bd.alert{background:#E9BE00;color:#0B0B0C}
.nav[aria-current="page"] .bd{background:var(--sunk);color:var(--fg)}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:0 4px}
.side-foot .btn{width:100%;justify-content:center}
.side .btn.primary,.topm .btn.primary{background:#fff;border-color:#fff;color:var(--side)}
.side .btn.primary:hover,.topm .btn.primary:hover{background:#E4E4E7}
.side .status{color:var(--side-muted);font-size:11.5px;padding:0 6px}
.main{min-width:0;padding:28px 32px 80px;display:grid;gap:22px;align-content:start;max-width:1320px;width:100%}
.topm{display:none}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head .sub{color:var(--muted);margin-top:4px}

/* piezas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.gauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;align-items:start}
.span2{grid-column:span 2}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--fg)}
.btn:hover{border-color:#C9CACE}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:wait}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:17px}
.f{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
.f:focus{border-color:var(--fg2);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.f{width:100%;resize:vertical;line-height:1.5}
.empty{color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--fg2);white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.wait{background:var(--wait-bg);color:var(--wait)} .chip.doing{background:var(--doing-bg);color:var(--doing)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
button.chip{cursor:pointer}
.chip.del{background:transparent;color:var(--muted);padding:2px 7px}
.chip.del.armed{background:var(--bad);color:#fff}
.marca{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.marca::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.marca.centenaria{color:var(--cente);background:var(--cente-bg)} .marca.centenaria::before{background:var(--cente-dot)}
.marca.latina{color:var(--latina);background:var(--latina-bg)} .marca.latina::before{background:var(--latina-dot)}
.marca.cente-azul{color:var(--azul);background:var(--azul-bg)} .marca.cente-azul::before{background:var(--azul-dot)}
.marca.ambas{color:var(--fg2);background:var(--sunk)} .marca.ambas::before{background:var(--muted)}
.count{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:6px;min-width:0}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.warn{border-color:#F3C9A6;background:linear-gradient(180deg,#FFF8F2,#fff)}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}

/* hoy */
.hero{background:linear-gradient(120deg,#0B0B0C 0%,#1C1C1F 60%,#2C2D31 100%);color:#fff;border-radius:16px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero .label{color:#A9ABB1}
.hero h2{font-size:22px;font-weight:800;color:#fff;margin-top:6px}
.hero .tema{font-size:15px;color:#E4E4E7;margin-top:6px}
.hero .chk{display:grid;gap:8px;min-width:220px}
.hero .chk button{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:9px 12px;font-weight:600;text-align:left}
.hero .chk button[aria-pressed="true"]{background:#fff;color:var(--fg)}
.hero .chk .box{width:18px;height:18px;border-radius:5px;border:2px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}
.alerta{display:flex;gap:12px;align-items:flex-start;background:#FFF8E5;border:1px solid #F2DD9B;border-radius:12px;padding:14px 16px}
.alerta b{display:block}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0;text-align:left}
.day.hoy{border-color:var(--fg);box-shadow:0 0 0 3px var(--accent-soft)}
.day .dn{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .tt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.6em}
.day .tt.no{color:var(--muted);font-weight:500}
.lst{list-style:none;margin:0;padding:0;display:grid}
.lst li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.lst li:first-child{border-top:0}
.lst .fr{font-size:11.5px;font-weight:600;color:var(--muted);min-width:9.5em;flex:none}

/* calendario */
.dia{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.dia.hoy{border-color:var(--accent)}
.dia.publicado{border-color:#9ED3AE;background:linear-gradient(180deg,#F3FBF5,#fff)}
.dia-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dia-h b{font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;border:0;background:transparent;padding:5px 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.est{display:grid;grid-template-columns:1fr 1fr}
.seg.est button.on{background:var(--accent);color:#fff}
.dia textarea.f{font-size:13px;min-height:62px}
.redes{display:flex;gap:6px;flex-wrap:wrap}
.redes button{border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:11.5px;font-weight:700;padding:3px 8px;color:var(--muted)}
.redes button[aria-pressed="true"]{background:var(--ok-bg);border-color:#9ED3AE;color:var(--ok)}
.fch{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 7px;background:var(--doing-bg);color:var(--doing);max-width:100%}
.fch.comercial{background:#FDEFD9;color:#8A4B06}
.fch.evento{background:var(--ok-bg);color:var(--ok)}
.fch.puente{background:var(--sunk);color:var(--fg2)}
.fchs{display:flex;flex-wrap:wrap;gap:4px}
.flist{list-style:none;margin:0;padding:0;display:grid}
.flist li{display:grid;grid-template-columns:5.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0}
.flist .fd{font-weight:700;font-size:12.5px}
.flist .fq{font-size:11.5px;color:var(--muted)}
.ugc-slot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}

/* grilla del mes */
.seg.calv{background:var(--sunk)}
.seg.calv button{padding:6px 14px;font-size:12.5px}
.mes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.5fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.mes .dh{background:#FAFBFA;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.mc{background:var(--surface);border:0;border-top:3px solid transparent;text-align:left;padding:7px 9px 9px;min-height:128px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;color:var(--fg)}
button.mc:hover{background:#FAFBFA}
.mc.centenaria{border-top-color:var(--cente-dot)} .mc.latina{border-top-color:var(--latina-dot)} .mc.cente-azul{border-top-color:var(--azul-dot)}
.mc.publicado{background:linear-gradient(180deg,#F3FBF5,#fff)}
.mc.finde{background:#F8FAF8}
.mc.fuera>*{opacity:.4}
.mc-h{display:flex;align-items:center;gap:6px}
.mc-n{font-size:12px;font-weight:700;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;margin-left:-4px;color:var(--fg2)}
.mc.hoy .mc-n{background:var(--accent);color:#fff}
.mc-d{display:none;font-size:12px;font-weight:600;color:var(--muted)}
.mc .marca{font-size:11px;padding:2px 7px}
.mc-t{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;max-width:100%}
.mc-t.no{color:var(--muted);font-weight:500}
.mc .fch{font-size:10.5px;padding:1px 6px}
.mc-pie{margin-top:auto;gap:4px}
.mc-pie .chip{font-size:11px;padding:1px 7px}
/* barra superior: quién está conectado y salir */
.topbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 32px;background:rgba(243,243,244,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar .status{font-size:12px;color:var(--muted)}
.usr{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.usr-t{display:grid;line-height:1.2;margin-right:6px}
.usr-t b{font-size:13.5px}
.usr-t span{font-size:11.5px;color:var(--muted)}
.usr-m{display:none}

/* avisos */
#avisos{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;width:min(380px,calc(100% - 32px));pointer-events:none}
/* cada aviso va en un envoltorio que se pliega al salir, así los de arriba bajan suave */
.aviso-w{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s cubic-bezier(.2,.8,.2,1)}
.aviso-w>div{min-height:0;overflow:hidden;padding:12px 28px 30px;margin:-4px -28px -30px}
.aviso-w.sale{grid-template-rows:0fr}
.aviso{position:relative;overflow:hidden;pointer-events:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;background:#141416;color:#fff;border-radius:12px;padding:11px 8px 11px 14px;font-size:13px;font-weight:600;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.2);
  animation:aviso-entra .34s cubic-bezier(.2,.9,.25,1.15) both}
.aviso-w.sale .aviso{animation:aviso-sale .24s ease-in both}
@keyframes aviso-entra{from{opacity:0;transform:translateX(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes aviso-sale{to{opacity:0;transform:translateX(36px)}}
.aviso-i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.14);flex:none}
.aviso-i.pop{animation:aviso-pop .32s cubic-bezier(.2,.9,.3,1.4)}
@keyframes aviso-pop{from{transform:scale(.4)}to{transform:none}}
/* barrita que muestra cuánto falta para que se cierre solo */
.aviso-b{position:absolute;left:0;bottom:0;height:2px;width:100%;background:rgba(255,255,255,.35);transform-origin:left;animation:aviso-tiempo linear forwards}
@keyframes aviso-tiempo{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.aviso:hover .aviso-b{animation-play-state:paused}
.aviso.ok .aviso-i{background:#2F8A4E}
.aviso.error{background:#7A1A12} .aviso.error .aviso-i{background:#B42318}
.aviso.conflicto{background:#7A3A0C} .aviso.conflicto .aviso-i{background:#C2570F}
.aviso.info .aviso-i{background:#1B5C8F}
.aviso-x{border:0;background:transparent;color:rgba(255,255,255,.7);font-size:18px;width:30px;height:30px;border-radius:8px}
.aviso-x:hover{background:rgba(255,255,255,.12);color:#fff}
@media (max-width:900px){#avisos{right:12px;left:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.aviso,.aviso-w.sale .aviso{animation:aviso-fundido .2s both}.aviso-w.sale .aviso{animation-direction:reverse}.aviso-w{transition:none}.aviso-i.pop{animation:none}}
@keyframes aviso-fundido{from{opacity:0}to{opacity:1}}

/* tareas */
.items{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 6px;border-radius:8px}
.item:hover{background:var(--bg)}
.item input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--accent)}
.item .txt{border:0;background:transparent;width:100%;padding:0;resize:none;line-height:1.45;overflow:hidden;field-sizing:content;min-height:1.45em}
.item.hecho .txt{color:var(--muted);text-decoration:line-through}
.acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.when{font-size:11.5px;color:var(--muted)}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;border:1px dashed #CDCED2;background:transparent;border-radius:9px;padding:8px 10px}
.toggle-done{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 0;text-align:left;font-weight:600}
.espera{background:linear-gradient(180deg,#FFF7F0,#fff);border-color:#F3D3BA}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#FAFBFA}
td input,td select{border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 6px;width:100%}
td input:hover,td select:hover,td input:focus,td select:focus{border-color:var(--line);background:#fff}
td.n input{text-align:right;font-variant-numeric:tabular-nums}
td.calc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
tr.nuevo td{background:#FAFBFA}
.wa{font-size:12px;font-weight:600;white-space:nowrap}

/* gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.08}
.chart .pt{fill:var(--accent);stroke:#fff;stroke-width:2}
.chart .hit{fill:transparent;cursor:default}
.chart .bar-own{fill:var(--accent)}
.chart .bar-oth{fill:#C4C6CB}
.chart .vl{fill:var(--fg2);font-weight:600}
.spark{width:100%;height:36px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2}
.spark .ar{fill:var(--accent);opacity:.1}
.spark .pt{fill:var(--accent)}
#tip{position:fixed;z-index:30;pointer-events:none;background:#141416;color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:7px;white-space:pre;box-shadow:0 6px 16px rgba(0,0,0,.18)}

/* ideas, docs */
.idea{display:grid;gap:8px}
.idea p{font-size:13.5px;color:var(--fg2)}
.idea .porque{color:var(--muted);font-size:12.5px}
.idea.usada,.idea.descartada{opacity:.6}
.doc{line-height:1.65;max-width:80ch;color:var(--fg2)}
.doc h1{font-size:24px;margin:0 0 .5em;color:var(--fg)} .doc h2{font-size:18px;margin:1.5em 0 .5em;color:var(--fg)} .doc h3{margin:1.2em 0 .4em;color:var(--fg)}
.doc table{min-width:0;font-size:13px;margin:.8em 0;border:1px solid var(--line);border-radius:8px} .doc td,.doc th{border-bottom:1px solid var(--line)}
.doc code{font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:5px}
.doc blockquote{margin:.8em 0;padding:.3em 1em;border-left:3px solid var(--line);color:var(--muted)}
.doc-wrap{overflow-x:auto}
.docs{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.doclist{display:grid;gap:2px;position:sticky;top:20px}
.doclist button{border:0;background:transparent;text-align:left;padding:8px 11px;border-radius:9px;color:var(--fg2);font-weight:500}
.doclist button:hover{background:var(--surface)}
.doclist button[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--fg2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

/* modal y login */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:16px;width:min(720px,100%);max-height:calc(100% - 32px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sheet textarea{width:100%;height:100%;min-height:320px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:14px;font:13px/1.55 ui-monospace,Consolas,monospace;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:var(--fg2)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(1200px 600px at 20% 0%,#FFFFFF,transparent),var(--bg)}
.login .logos{justify-content:center;gap:14px}
.login .logos img{height:56px}
.login h1{font-size:19px;text-align:center}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;display:grid;gap:14px;width:min(360px,100%);box-shadow:var(--shadow)}
.login input{font-size:24px;font-weight:700;letter-spacing:.35em;text-align:center}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}
@keyframes g{to{transform:rotate(360deg)}}

@media (max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .calnav{flex:1 1 100%}
  .calnav b{min-width:0!important;flex:1}
  .side{display:none}
  .topm{display:grid;gap:10px;position:sticky;top:0;z-index:10;background:var(--side);color:#fff;padding:12px 16px 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .topm .row b{font-size:14.5px}
  .topbar{display:none}
  .usr-m{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--side-fg);background:var(--side-hover);border-radius:10px;padding:6px 6px 6px 8px}
  .usr-m b{color:#fff}
  .usr-m .av{width:26px;height:26px;font-size:12px;background:#fff;color:var(--side)}
  .usr-m>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .salir-m{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font-weight:600;font-size:12.5px;border-radius:8px;padding:6px 12px}
  .topm .logos img{height:28px}
  .topm nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 10px}
  .topm nav::-webkit-scrollbar{display:none}
  .topm .nav{width:auto;white-space:nowrap;padding:7px 11px}
  .topm .nav svg{display:none}
  .main{padding:18px 16px 110px}
  .g2,.g3,.docs,.hero{grid-template-columns:1fr}
  .g5{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:auto}
  .doclist{position:static;grid-auto-flow:column;overflow-x:auto}
  .lst .fr{min-width:0}
  .lst li{flex-wrap:wrap;gap:2px 10px}
  .item{grid-template-columns:auto minmax(0,1fr)}
  .item .acts{grid-column:2;justify-content:flex-start}
  .head>div{flex:1 1 100%}
  .mes{grid-template-columns:1fr}
  .mes .dh,.mc.fuera,.mc.finde:not(.confecha){display:none}
  .mc{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;border-top:0;border-left:4px solid transparent}
  .mc.centenaria{border-left-color:var(--cente-dot)} .mc.latina{border-left-color:var(--latina-dot)} .mc.cente-azul{border-left-color:var(--azul-dot)}
  .mc-h{min-width:7.5em}
  .mc-d{display:inline}
  .mc-t{flex:1 1 100%;-webkit-line-clamp:2}
  .mc-pie{margin-top:0}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<body>
<div id="app"></div>
<div id="tip" hidden></div>
<div id="avisos" aria-live="polite"></div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS_L=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const ESTADOS_POST=[['pendiente','Pendiente'],['editando','Editando'],['listo','Listo'],['publicado','Publicado']];
const RED_TXT={ig:'IG',fb:'FB',tt:'TikTok'};
const RUBROS=[['influencer','Influencer'],['ugc','Creador UGC'],['comercio','Comercio / distribuidor'],['proveedor','Proveedor'],['nahuel','Equipo de Nahuel'],['medio','Medio / prensa'],['otro','Otro']];
const IDEA_EST=[['nueva','Nueva'],['elegida','Elegida'],['usada','Usada'],['descartada','Descartada']];
const COMPETIDORES=[['rei-verde','Rei Verde'],['barao','Barão'],['verdecita','Verdecita'],['canarias','Canarias'],['sara','Sara'],['uruguai','Uruguaí']];
const UGC_EST=[['pedido','Pedido'],['recibido','Recibido'],['publicado','Publicado']];

const S={regs:[],meta:{frentes:[],marcas:{},calendario:{},redes:{},ejes:{},ugcMes:[],cuentasRed:[],cuentasCompetencia:[],estadosContacto:{}},ia:false,open:{},armed:null,vista:'hoy',doc:null,editDoc:false,filtroRubro:'todos',filtroIdea:'abiertas',chat:[],busy:{},compSel:'rei-verde',metSel:'ig-latina',mesAds:null,rol:null,calVista:'semana'};
try{const t=localStorage.getItem('gn-vista');if(t)S.vista=t;const c=localStorage.getItem('gn-cal');if(c)S.calVista=c}catch(e){}

/* fechas: el navegador está en hora argentina */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,m-1,d)};
const hoyISO=()=>iso(new Date());
function lunes(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function semanaInicial(){const h=new Date();const l=lunes(h);if(h.getDay()===0||h.getDay()===6)l.setDate(l.getDate()+7);return l}
let semana=semanaInicial();
let mesCal=(()=>{const d=addDays(semana,2);return new Date(d.getFullYear(),d.getMonth(),1)})();
function lblSemana(l){const f=addDays(l,4);return `${l.getDate()}${l.getMonth()!==f.getMonth()?' de '+MESES[l.getMonth()]:''} al ${f.getDate()} de ${MESES[f.getMonth()]}`}
function corta(s){if(!s)return'';const d=String(s).length<=10?parse(s):new Date(s);return `${DIAS[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}`}
const fmt=n=>(Number(n)||0).toLocaleString('es-AR');
const pesos=n=>'$'+Math.round(Number(n)||0).toLocaleString('es-AR');
const nmb=v=>Number(String(v??'').replace(/\./g,'').replace(',','.'))||0;

/* api */
async function api(method,path,body){
  const r=await fetch(path,{method,headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin'});
  const d=await r.json().catch(()=>({}));
  if(r.status===401&&d.login){S.logueado=false;render();throw new Error('Sesión vencida')}
  if(!r.ok)throw Object.assign(new Error(d.error||`Error ${r.status}`),{status:r.status,datos:d});
  return d;
}
function status(t){document.querySelectorAll('.status').forEach(el=>el.textContent=t)}
const hora=()=>new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
const NOMBRE={lautaro:'Lautaro',franco:'Franco'};
const SEGUIDOS=['posteo','evento','idea'];
function queEs(r){return r.tipo==='posteo'?`la publicación del ${corta(r.fecha||r.clave)}`:r.tipo==='evento'?`el evento «${r.titulo}»`:r.tipo==='idea'?`la idea «${r.titulo}»`:'un registro'}
async function cargar(){
  const d=await api('GET','/api/datos');
  if(S.rol&&S.rol!==d.rol)$('app').innerHTML='';
  // Lo que cambió la otra persona desde la última lectura.
  if(S.logueado&&S.rol===d.rol){
    const vistos=new Map(S.regs.filter(r=>SEGUIDOS.includes(r.tipo)&&!String(r.id).startsWith('tmp-')).map(r=>[r.id,r]));
    const nuevos=d.registros.filter(r=>SEGUIDOS.includes(r.tipo));
    const msgs=[];
    for(const r of nuevos){const v=vistos.get(r.id);if(r.editadoPor&&r.editadoPor!==d.rol&&(!v||v.actualizado!==r.actualizado))msgs.push(`${NOMBRE[r.editadoPor]||r.editadoPor} ${v?'cambió':'cargó'} ${queEs(r)}`)}
    const ids=new Set(nuevos.map(r=>r.id));
    for(const v of vistos.values())if(!ids.has(v.id)&&v.tipo==='evento')msgs.push(`Se borró ${queEs(v)}`);
    if(msgs.length)aviso('info',msgs.slice(0,3).join(' · ')+(msgs.length>3?` y ${msgs.length-3} cambios más`:''));
  }
  Object.assign(S,{regs:d.registros,meta:d.meta,ia:d.ia,rol:d.rol,logueado:true});
  render();status('Actualizado '+hora());
}
const de=t=>S.regs.filter(r=>r.tipo===t);
const buscar=id=>S.regs.find(r=>r.id===id);

/* avisos abajo: cada cambio dice si la base lo confirmó o no */
// Abajo a la derecha. Entran deslizando desde la derecha, los que se cierran
// solos muestran una barrita de tiempo (se pausa con el mouse encima) y al
// salir se pliegan para que el resto baje suave. Máximo 4 a la vista.
let avisoN=0;
const ICO_AV={ok:'✓',error:'!',conflicto:'!',info:'↻'};
const DURA={ok:3500,info:9000};
function cerrarAviso(w){if(!w||!w.isConnected||w.classList.contains('sale'))return;w.classList.add('sale');setTimeout(()=>w.remove(),280)}
function temporizar(w,tipo){
  const a=w.querySelector('.aviso');a.querySelector('.aviso-b')?.remove();clearTimeout(w._t);
  if(!DURA[tipo])return;
  const b=document.createElement('span');b.className='aviso-b';b.style.animationDuration=DURA[tipo]+'ms';a.appendChild(b);
  b.addEventListener('animationend',()=>cerrarAviso(w));
}
function aviso(tipo,texto){
  const box=$('avisos');if(!box)return;
  const w=document.createElement('div');w.className='aviso-w';w.id='av'+(++avisoN);
  w.innerHTML=`<div><div class="aviso ${tipo}" role="${tipo==='error'||tipo==='conflicto'?'alert':'status'}"><span class="aviso-i">${tipo==='guardando'?'<span class="spin"></span>':ICO_AV[tipo]}</span><span class="aviso-t">${esc(texto)}</span><button class="aviso-x" aria-label="Cerrar">×</button></div></div>`;
  box.appendChild(w);
  const vivos=[...box.children].filter(x=>!x.classList.contains('sale'));
  vivos.slice(0,Math.max(0,vivos.length-4)).forEach(cerrarAviso);
  temporizar(w,tipo);
  return w;
}
function resolverAviso(w,tipo,texto){
  if(!w||!w.isConnected||w.classList.contains('sale')){aviso(tipo,texto);return}
  const a=w.querySelector('.aviso');a.className='aviso '+tipo;a.setAttribute('role',tipo==='ok'||tipo==='info'?'status':'alert');
  const i=a.querySelector('.aviso-i');i.textContent=ICO_AV[tipo];i.classList.remove('pop');void i.offsetWidth;i.classList.add('pop');
  a.querySelector('.aviso-t').textContent=texto;
  temporizar(w,tipo);
}
// La respuesta es la fila que devolvió la base (RETURNING): se compara campo por campo con lo que se mandó.
const coincide=(fila,datos)=>fila&&Object.entries(datos).every(([k,v])=>JSON.stringify(fila[k]??null)===JSON.stringify(v??null));
function fallaGuardado(el,e,verbo='se guardó'){
  if(e.status===401)return resolverAviso(el,'error','Se venció la sesión: volvé a entrar con tu PIN.');
  if(e.status===404){resolverAviso(el,'info',e.message);cargar().catch(()=>{});return}
  resolverAviso(el,'error',`No ${verbo}: ${e.message}. Recargué los datos de la base.`);cargar().catch(()=>{});
}
async function nuevo(tipo,datos){
  status('Guardando…');const el=aviso('guardando','Guardando…');
  try{const r=await api('POST','/api/datos',{tipo,datos});
    if(!r.id||!coincide(r,datos))throw new Error('la base no devolvió lo que mandaste');
    S.regs.push(r);render();status('Guardado '+hora());resolverAviso(el,'ok','Guardado en la base · '+hora());return r}
  catch(e){status('No se guardó: '+e.message);fallaGuardado(el,e)}
}
// `antes`: cómo veía la persona los campos que cambió. Si otro los tocó en el
// medio, el servidor no pisa nada y devuelve 409 con lo que hay en la base.
async function porClave(tipo,clave,datos,antes){
  const prev=S.regs.find(r=>r.tipo===tipo&&r.clave===clave);
  if(prev)Object.assign(prev,datos);else S.regs.push({tipo,clave,...datos,id:'tmp-'+tipo+clave});
  render();status('Guardando…');const el=aviso('guardando','Guardando…');
  try{const r=await api('POST','/api/datos',{tipo,clave,datos,antes});
    if(!coincide(r,datos))throw new Error('la base no devolvió lo que mandaste');
    S.regs=S.regs.filter(x=>!(x.tipo===tipo&&x.clave===clave));S.regs.push(r);status('Guardado '+hora());resolverAviso(el,'ok','Guardado en la base · '+hora())}
  catch(e){
    if(e.status===409){const act=e.datos?.actual;S.regs=S.regs.filter(x=>!(x.tipo===tipo&&x.clave===clave));if(act)S.regs.push(act);render(true);status('No se guardó: conflicto');
      resolverAviso(el,'conflicto',`${NOMBRE[act?.editadoPor]||'Otra persona'} cambió ${act?queEs(act):'esto'} mientras lo editabas. No pisé nada: quedó su versión, revisala y volvé a cargar lo tuyo si hace falta.`);return}
    status('No se guardó: '+e.message);fallaGuardado(el,e)}
}
async function cambiar(id,cambios){
  const r=buscar(id);if(r)Object.assign(r,cambios);render();status('Guardando…');const el=aviso('guardando','Guardando…');
  try{const f=await api('PATCH','/api/datos',{id,cambios});if(!coincide(f,cambios))throw new Error('la base no devolvió lo que mandaste');
    if(r)Object.assign(r,f);status('Guardado '+hora());resolverAviso(el,'ok','Guardado en la base · '+hora())}
  catch(e){status('No se guardó: '+e.message);fallaGuardado(el,e)}
}
async function quitar(id){
  S.regs=S.regs.filter(r=>r.id!==id);render();const el=aviso('guardando','Borrando…');
  try{await api('DELETE','/api/datos',{id});status('Borrado '+hora());resolverAviso(el,'ok','Borrado de la base · '+hora())}
  catch(e){status('No se borró: '+e.message);fallaGuardado(el,e,'se borró')}
}
// Lo que la persona veía en la base (no los valores por defecto del calendario).
function vistoAntes(tipo,clave,campos){const r=S.regs.find(x=>x.tipo===tipo&&x.clave===clave)||{};return Object.fromEntries(campos.map(k=>[k,r[k]??null]))}
function armar(id){
  if(S.armed!==id){S.armed=id;render();setTimeout(()=>{if(S.armed===id){S.armed=null;render()}},3000);return false}
  S.armed=null;return true;
}
const delBtn=id=>`<button class="chip del ${S.armed===id?'armed':''}" data-del="${id}" aria-label="Borrar">${S.armed===id?'¿Borrar?':'×'}</button>`;
const marcaChip=m=>`<span class="marca ${m||'ambas'}">${esc(S.meta.marcas[m]||(m==='ambas'?'Las dos':m))}</span>`;
const frenteNombre=id=>S.meta.frentes.find(f=>f.id===id)?.nombre||id;

/* posteos */
function posteo(fecha){
  const p=S.regs.find(r=>r.tipo==='posteo'&&r.clave===fecha);
  const base=S.meta.calendario[parse(fecha).getDay()];
  if(!base)return p||null;
  return {marca:base.marca,aCargo:base.aCargo,estado:'pendiente',redes:{},...(p||{}),fecha};
}
const TIPO_F={feriado:'Feriado',puente:'Puente',comercial:'Fecha comercial',evento:'Evento'};
const fechasDe=f=>(S.meta.fechas||[]).filter(x=>x.fecha===f);
const fchChips=f=>{const l=fechasDe(f);return l.length?`<div class="fchs">${l.map(x=>`<span class="fch ${x.tipo}" title="${esc(TIPO_F[x.tipo])}">${esc(x.titulo)}</span>`).join('')}</div>`:''};
function faltan(f){const n=Math.round((parse(f)-parse(hoyISO()))/864e5);return n===0?'hoy':n===1?'mañana':n<0?'pasó':`en ${n} días`}
function listaFechas(dias,{borrar=false}={}){const hoy=hoyISO(),lim=iso(addDays(new Date(),dias));const l=(S.meta.fechas||[]).filter(x=>x.fecha>=hoy&&x.fecha<=lim);
  return l.length?`<ul class="flist">${l.map(x=>`<li><span><span class="fd">${corta(x.fecha)}</span><br><span class="fq">${faltan(x.fecha)}</span></span><span><span class="fch ${x.tipo}">${esc(TIPO_F[x.tipo])}</span> <b style="font-size:13.5px">${esc(x.titulo)}</b>${x.lugar||x.marca&&x.marca!=='ambas'?`<br><span class="fq">${[x.marca&&S.meta.marcas[x.marca],x.lugar].filter(Boolean).map(esc).join(' · ')}</span>`:''}</span>${borrar&&x.id?delBtn(x.id):'<span></span>'}</li>`).join('')}</ul>`:'<p class="empty">Nada en este período.</p>'}
const diasSemana=l=>[0,1,2,3,4].map(i=>iso(addDays(l,i)));

/* ===== gráficos (SVG a mano, una serie, tooltip propio) ===== */
function sparkline(vals){
  if(vals.length<2)return `<svg class="spark" viewBox="0 0 120 36" aria-hidden="true"><line x1="0" y1="30" x2="120" y2="30" stroke="#E3E9E3"/></svg>`;
  const mn=Math.min(...vals),mx=Math.max(...vals),r=mx-mn||1;
  const pts=vals.map((v,i)=>[i/(vals.length-1)*116+2,32-((v-mn)/r)*26]);
  const d=pts.map(p=>p.join(',')).join(' ');const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 120 36" preserveAspectRatio="none" aria-hidden="true"><polygon class="ar" points="2,34 ${d} ${last[0]},34"/><polyline class="ln" points="${d}" vector-effect="non-scaling-stroke"/><circle class="pt" cx="${last[0]}" cy="${last[1]}" r="2.5"/></svg>`;
}
function niceTicks(mn,mx,n=4){const span=mx-mn||Math.max(1,Math.abs(mx));const step0=span/n;const mag=10**Math.floor(Math.log10(step0));const step=[1,2,2.5,5,10].map(m=>m*mag).find(s=>s>=step0);const a=Math.floor(mn/step)*step,b=Math.ceil(mx/step)*step;const t=[];for(let v=a;v<=b+1e-9;v+=step)t.push(v);return t}
const corto=n=>Math.abs(n)>=1000?(n/1000).toLocaleString('es-AR',{maximumFractionDigits:1})+' mil':fmt(n);
function lineChart(puntos,{alto=220,etiqueta='seguidores'}={}){
  if(puntos.length<2)return `<p class="empty">Hacen falta al menos dos cargas para dibujar la evolución.</p>`;
  const W=1000,H=alto*1.3,L=64,R=16,T=14,B=28;
  const ys=puntos.map(p=>p.y);const ticks=niceTicks(Math.min(...ys),Math.max(...ys));
  const y0=ticks[0],y1=ticks[ticks.length-1];
  const t0=parse(puntos[0].x).getTime(),t1=parse(puntos[puntos.length-1].x).getTime();
  const X=x=>L+((parse(x).getTime()-t0)/((t1-t0)||1))*(W-L-R);
  const Y=y=>T+(1-(y-y0)/((y1-y0)||1))*(H-T-B);
  const d=puntos.map(p=>`${X(p.x)},${Y(p.y)}`).join(' ');
  const xl=[puntos[0],puntos[Math.floor(puntos.length/2)],puntos[puntos.length-1]].filter((p,i,a)=>a.indexOf(p)===i);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución de ${etiqueta}">
    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${corto(t)}</text>`).join('')}
    ${xl.map(p=>`<text x="${X(p.x)}" y="${H-8}" text-anchor="middle">${corta(p.x)}</text>`).join('')}
    <polygon class="ar" points="${X(puntos[0].x)},${Y(y0)} ${d} ${X(puntos[puntos.length-1].x)},${Y(y0)}"/>
    <polyline class="ln" points="${d}"/>
    ${puntos.map(p=>`<circle class="pt" cx="${X(p.x)}" cy="${Y(p.y)}" r="4"/><circle class="hit" cx="${X(p.x)}" cy="${Y(p.y)}" r="14" data-tip="${esc(corta(p.x)+'\n'+fmt(p.y)+' '+etiqueta)}"/>`).join('')}
  </svg>`;
}
function hBars(items,{fmtV=fmt}={}){
  if(!items.length)return '<p class="empty">Sin datos todavía.</p>';
  const W=1000,rowH=34,L=130,R=90,H=items.length*rowH+6;const mx=Math.max(...items.map(i=>i.v))||1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Comparación">
    ${items.map((it,k)=>{const y=k*rowH+6,w=Math.max(4,(it.v/mx)*(W-L-R));return `<text x="${L-10}" y="${y+17}" text-anchor="end" style="${it.own?'fill:#142019;font-weight:700':''}">${esc(it.label)}</text>
      <path class="${it.own?'bar-own':'bar-oth'}" d="M${L},${y+4} h${w-4} a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 h-${w-4} z"/>
      <text class="vl" x="${L+w+8}" y="${y+17}">${it.v?fmtV(it.v):'sin dato'}</text>
      <rect class="hit" x="0" y="${y}" width="${W}" height="${rowH}" data-tip="${esc(it.tip||it.label+': '+fmtV(it.v))}"/>`}).join('')}
  </svg>`;
}
function vBars(items,{alto=200,fmtV=fmt}={}){
  if(!items.length)return '<p class="empty">Todavía no hay campañas cargadas.</p>';
  const W=1000,H=alto*1.3,L=44,R=10,T=18,B=30;const mx=Math.max(...items.map(i=>i.v),1);const ticks=niceTicks(0,mx,3);const top=ticks[ticks.length-1];
  const bw=Math.min(56,(W-L-R)/items.length-14);const step=(W-L-R)/items.length;
  const Y=v=>T+(1-v/top)*(H-T-B);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Consultas por campaña">
    ${ticks.map(t=>`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-8}" y="${Y(t)+4}" text-anchor="end">${fmtV(t)}</text>`).join('')}
    ${items.map((it,k)=>{const x=L+k*step+(step-bw)/2,y=Y(it.v),h=Math.max(0,Y(0)-y);return `${h>0?`<path class="bar-own" d="M${x},${Y(0)} v-${Math.max(h-4,0)} a4,4 0 0 1 4,-4 h${bw-8} a4,4 0 0 1 4,4 v${Math.max(h-4,0)} z"/>`:''}
      <text class="vl" x="${x+bw/2}" y="${y-6}" text-anchor="middle">${fmtV(it.v)}</text>
      <text x="${x+bw/2}" y="${H-10}" text-anchor="middle">${esc(it.label)}</text>
      <rect class="hit" x="${L+k*step}" y="${T}" width="${step}" height="${H-T-B}" data-tip="${esc(it.tip)}"/>`}).join('')}
  </svg>`;
}

function avance(y,m){
  const tot={centenaria:[0,0],latina:[0,0],'cente-azul':[0,0]};
  for(let d=new Date(y,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)){const p=posteo(iso(d));if(!p||!tot[p.marca])continue;tot[p.marca][1]++;if(p.estado==='publicado')tot[p.marca][0]++}
  return `<section class="card"><div class="card-h"><h2>Avance de ${MESES[m]}</h2><span class="small muted">Publicados sobre días asignados</span></div>
    <div class="g3">${Object.entries(tot).map(([k,[a,b]])=>`<div style="display:grid;gap:6px"><div class="row between">${marcaChip(k)}<b class="num">${a} / ${b}</b></div><div class="bar"><i style="width:${b?a/b*100:0}%"></i></div></div>`).join('')}</div></section>`;
}
function calHead(nav){
  const sub=S.rol==='franco'?'Las publicaciones de las tres marcas, un posteo por día hábil.':'Un posteo por día hábil, con su marca fija. Los martes se coordina con la oficina lo que sale desde el miércoles.';
  return head('Calendario',sub,`<div class="row"><div class="seg calv" role="group" aria-label="Vista">${[['semana','Semana'],['mes','Mes']].map(([k,t])=>`<button data-calv="${k}" class="${S.calVista===k?'on':''}" aria-pressed="${S.calVista===k}">${t}</button>`).join('')}</div><div class="row calnav">${nav}</div></div>`);
}

/* ===== CALENDARIO: grilla del mes ===== */
const EST_CHIP={publicado:'ok',listo:'doing',editando:'wait',pendiente:'ghost'};
function vMes(){
  const y=mesCal.getFullYear(),m=mesCal.getMonth();const hoy=hoyISO();
  const ini=lunes(new Date(y,m,1));const ult=new Date(y,m+1,0);
  const semanas=Math.ceil((Math.round((ult-ini)/864e5)+1)/7);
  const celdas=[];
  for(let i=0;i<semanas*7;i++){const d=addDays(ini,i);const f=iso(d);const fuera=d.getMonth()!==m;const finde=d.getDay()===0||d.getDay()===6;
    const p=finde?null:posteo(f);const fs=fechasDe(f);
    const cls=['mc',fuera?'fuera':'',f===hoy?'hoy':'',finde?'finde':'',p?.marca||'',p?.estado==='publicado'?'publicado':'',fs.length?'confecha':''].join(' ');
    const num=`<span class="mc-h"><span class="mc-n">${d.getDate()}</span><span class="mc-d">${DIAS_L[d.getDay()]}</span></span>`;
    if(finde){celdas.push(`<div class="${cls}">${num}${fchChips(f)}</div>`);continue}
    const est=ESTADOS_POST.find(e=>e[0]===p.estado)?.[1]||p.estado;
    celdas.push(`<button class="${cls}" data-irsemana="${f}" aria-label="${esc(`${DIAS_L[d.getDay()]} ${d.getDate()}: ${S.meta.marcas[p.marca]||''}, ${p.tema||'sin tema'}, ${est}`)}">
      ${num}${marcaChip(p.marca)}<span class="mc-t ${p.tema?'':'no'}">${p.tema?esc(p.tema):'Sin tema'}</span>${fchChips(f)}
      <span class="row mc-pie">${p.eje?`<span class="chip">${esc(S.meta.ejes[p.eje])}</span>`:''}<span class="chip ${EST_CHIP[p.estado]||''}">${esc(est)}</span></span></button>`)}
  const cab=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="dh">${d}</div>`).join('');
  const posts=[];for(let d=new Date(y,m,1);d.getMonth()===m;d.setDate(d.getDate()+1)){const p=posteo(iso(d));if(p)posts.push(p)}
  const cuenta=k=>posts.filter(p=>p.estado===k).length;
  return `${calHead(`<button class="iconbtn" id="mprev" aria-label="Mes anterior">‹</button><b style="min-width:9em;text-align:center;text-transform:capitalize">${MESES[m]} ${y}</b><button class="iconbtn" id="mnext" aria-label="Mes siguiente">›</button><button class="btn sm" id="mhoy">Este mes</button>`)}
  <div class="row"><span class="small muted">${posts.length} publicaciones en el mes:</span>${ESTADOS_POST.map(([k,t])=>`<span class="chip ${EST_CHIP[k]}">${t} ${cuenta(k)}</span>`).join('')}<span class="small muted">· Tocá un día para editarlo.</span></div>
  <div class="mes">${cab}${celdas.join('')}</div>
  ${avance(y,m)}
  ${calFechas()}`;
}

document.addEventListener('submit',async e=>{
  const f=e.target;e.preventDefault();
  if(f.id==='login'){const pin=$('pin').value.trim();if(!pin)return;$('login-msg').textContent='Entrando…';try{await api('POST','/api/entrar',{pin});await cargar()}catch(err){$('login-msg').textContent=err.message}return}
  if(f.id==='captura'){const v=$('cap-txt').value.trim();if(!v)return;$('cap-txt').value='';await nuevo('nota',{texto:v,origen:'panel',archivada:false});status('Anotado en la bandeja');return}
  if(f.classList.contains('add')&&f.dataset.frente){const inp=f.querySelector('input');const v=inp.value.trim();if(!v)return;inp.value='';await nuevo('tarea',{frente:f.dataset.frente,texto:v,estado:'pendiente',deNahuel:false,hechoEn:null});$('add-'+f.dataset.frente)?.focus();return}
  if(f.id==='nueva-idea'){const v=$('ni-txt').value.trim();if(!v){$('ni-txt').focus();return}
    const datos={titulo:v,marca:$('ni-marca')?.value||'ambas',estado:'nueva',origen:S.rol==='franco'?'Franco':'propia'};const d=$('ni-desc')?.value.trim();if(d)datos.descripcion=d;
    $('ni-txt').value='';if($('ni-desc'))$('ni-desc').value='';await nuevo('idea',datos);return}
  if(f.id==='nueva-obs'){const v=$('obs-txt').value.trim();if(!v)return;$('obs-txt').value='';const nombre=COMPETIDORES.find(c=>c[0]===S.compSel)[1];await nuevo('obs',{competidor:nombre,texto:v,origen:'propia',fecha:hoyISO()});return}
  if(f.id==='nuevo-evento'){const titulo=$('ev-tit').value.trim(),fecha=$('ev-fecha').value;if(!titulo||!fecha){status('Falta el nombre o la fecha del evento');return}
    await nuevo('evento',{titulo,fecha,marca:$('ev-marca').value,lugar:$('ev-lugar').value.trim()});await cargar();status('Evento agregado');return}
  if(f.id==='carga-met'||f.id==='carga-comp'){
    const fecha=f.id==='carga-met'?$('met-fecha').value||hoyISO():hoyISO();let n=0;
    for(const inp of f.querySelectorAll('[data-met-in]')){const v=nmb(inp.value.replace(/k$/i,'000'));if(!v)continue;n++;await porClave('metrica',`${inp.dataset.metIn}_${fecha}`,{cuenta:inp.dataset.metIn,fecha,seguidores:v})}
    status(n?`${n} cuentas guardadas`:'No cargaste ningún número');return;
  }
  if(f.id==='gen-ideas'){S.busy.ideas=true;render();
    try{const r=await api('POST','/api/ia',{modo:'ideas',marca:$('gi-marca').value,cantidad:$('gi-cant').value,foco:$('gi-foco').value});S.regs.push(...r.ideas);S.ideasResumen=r.resumen;S.filtroIdea='abiertas';status(`${r.ideas.length} ideas nuevas`)}catch(err){status('No salió: '+err.message)}
    S.busy.ideas=false;render();return}
  if(f.id==='preg'){const q=$('preg-txt').value.trim();if(!q)return;$('preg-txt').value='';const item={q};S.chat.unshift(item);S.busy.preg=true;render();
    try{const r=await api('POST','/api/ia',{modo:'pregunta',texto:q});item.a=r.texto}catch(err){item.err=err.message}S.busy.preg=false;render();return}
});

document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-vista]');if(!t)return;
  if(t.classList.contains('aviso-x')){cerrarAviso(t.closest('.aviso-w'));return}
  if(t.dataset.vista){S.vista=t.dataset.vista;S.editDoc=false;try{localStorage.setItem('gn-vista',S.vista)}catch(err){}render();window.scrollTo(0,0);return}
  if(t.id==='exportar'||t.id==='exportar-m')return abrirReporte();
  if(t.id==='prev'){semana=addDays(semana,-7);return render()}
  if(t.id==='next'){semana=addDays(semana,7);return render()}
  if(t.id==='hoy'){semana=semanaInicial();return render()}
  if(t.id==='mprev'||t.id==='mnext'){mesCal=new Date(mesCal.getFullYear(),mesCal.getMonth()+(t.id==='mnext'?1:-1),1);return render()}
  if(t.id==='mhoy'){const d=new Date();mesCal=new Date(d.getFullYear(),d.getMonth(),1);return render()}
  if(t.dataset.calv){S.calVista=t.dataset.calv;try{localStorage.setItem('gn-cal',S.calVista)}catch(err){}
    if(S.calVista==='mes'){const d=addDays(semana,2);mesCal=new Date(d.getFullYear(),d.getMonth(),1)}return render()}
  if(t.dataset.irsemana){semana=lunes(parse(t.dataset.irsemana));S.calVista='semana';try{localStorage.setItem('gn-cal','semana')}catch(err){}render();window.scrollTo(0,0);return}
  if(t.id==='salir'||t.id==='salir-m'){try{await api('DELETE','/api/entrar')}catch(err){}S.logueado=false;S.regs=[];return render()}
  if(t.dataset.del){if(armar(t.dataset.del)){const ev=buscar(t.dataset.del)?.tipo==='evento';await quitar(t.dataset.del);if(ev)cargar()}return}
  if(t.dataset.toggle){S.open[t.dataset.toggle]=!S.open[t.dataset.toggle];return render()}
  if(t.dataset.diario){const hoy=hoyISO();const d=S.regs.find(r=>r.tipo==='diario'&&r.clave===hoy)||{};return porClave('diario',hoy,{fecha:hoy,[t.dataset.diario]:!d[t.dataset.diario]})}
  const dia=t.closest('[data-fecha]');
  if(dia&&(t.dataset.eje||t.dataset.est||t.dataset.red)){const f=dia.dataset.fecha;const p=posteo(f);const c={marca:p.marca,aCargo:p.aCargo,fecha:f};
    if(t.dataset.eje)c.eje=p.eje===t.dataset.eje?null:t.dataset.eje;
    if(t.dataset.est)c.estado=t.dataset.est;
    if(t.dataset.red)c.redes={...(p.redes||{}),[t.dataset.red]:!p.redes?.[t.dataset.red]};
    if(c.estado==='publicado'&&!Object.values(p.redes||{}).some(Boolean))c.redes=Object.fromEntries((S.meta.redes[p.marca]||[]).map(r=>[r,true]));
    return porClave('posteo',f,c,vistoAntes('posteo',f,Object.keys(c).filter(k=>!['marca','aCargo','fecha'].includes(k))))}
  if(t.dataset.act){const li=t.closest('.item');const it=buscar(li.dataset.id);if(!it)return;
    if(t.dataset.act==='estado')return cambiar(it.id,{estado:it.estado==='en curso'?'pendiente':'en curso'});
    if(t.dataset.act==='nahuel')return cambiar(it.id,{deNahuel:!it.deNahuel});return}
  if(t.dataset.a){const card=t.closest('[data-nota]');const n=buscar(card.dataset.nota);if(!n)return;
    if(t.dataset.a==='tarea')await nuevo('tarea',{frente:$('nf-'+n.id).value,texto:n.texto,estado:'pendiente',deNahuel:false,hechoEn:null});
    if(t.dataset.a==='contacto'){const tel=(n.texto.match(/\+?\d[\d\s-]{7,}\d/)||[''])[0];await nuevo('contacto',{nombre:n.de||n.texto.replace(tel,'').replace(/[:\-]\s*$/,'').trim().slice(0,60),telefono:tel,rubro:'otro',marca:'ambas',estado:'encontrado',nota:n.texto})}
    if(t.dataset.a==='idea')await nuevo('idea',{titulo:n.texto.slice(0,140),descripcion:n.texto.length>140?n.texto:'',marca:'ambas',estado:'nueva',origen:'bandeja'});
    return cambiar(n.id,{archivada:true})}
  if(t.id==='nc-add'){const nombre=$('nc-nombre').value.trim();if(!nombre){$('nc-nombre').focus();return}
    await nuevo('contacto',{nombre,rubro:$('nc-rubro').value,marca:$('nc-marca').value,telefono:$('nc-tel').value.trim(),seguidores:$('nc-seg').value.trim(),nota:$('nc-nota').value.trim(),estado:'encontrado'});$('nc-nombre')?.focus();return}
  if(t.dataset.usar){const i=buscar(t.dataset.usar);const f=$('iu-'+i.id).value;const p=posteo(f);
    await porClave('posteo',f,{marca:p.marca,aCargo:p.aCargo,fecha:f,tema:i.titulo,ideaId:i.id},vistoAntes('posteo',f,['tema']));await cambiar(i.id,{estado:'elegida'});status('Quedó en el '+corta(f));return}
  if(t.id==='nueva-camp'){const ult=de('campana').sort((a,b)=>String(b.fin).localeCompare(String(a.fin)))[0];
    const ini=ult&&ult.fin>=hoyISO()?iso(addDays(parse(ult.fin),1)):hoyISO();const n=de('campana').length+1;
    await nuevo('campana',{nombre:`Distribuidores ${n}`,cuenta:'yerbamatelatina',eje:'distribucion',inicio:ini,fin:iso(addDays(parse(ini),6)),presupuesto:'',gasto:'',consultas:'',compras:'',nota:''});return}

  if(t.dataset.comp){S.compSel=t.dataset.comp;return render()}

  if(t.id==='obs-ia'){const nombre=COMPETIDORES.find(c=>c[0]===S.compSel)[1];S.busy.comp=true;render();

  if(t.dataset.doc){S.doc=t.dataset.doc;S.editDoc=false;return render()}
  if(t.dataset.nuevodoc){const r=await nuevo('saber',{slug:'doc-'+Date.now(),titulo:'Documento nuevo',cuerpo:'# Documento nuevo\n\n',orden:50});if(r){S.doc=r.slug;S.editDoc=true;render()}return}
  if(t.id==='ed-abrir'){S.editDoc=true;return render()}
  if(t.id==='ed-cancelar'){S.editDoc=false;return render()}
  if(t.id==='ed-guardar'){const d=de('saber').find(x=>x.slug===S.doc);S.editDoc=false;return cambiar(d.id,{titulo:$('ed-tit').value.trim()||d.titulo,cuerpo:$('ed-cuerpo').value})}
  if(t.dataset.guardarResp){const c=S.chat[t.dataset.guardarResp];const r=await nuevo('saber',{slug:'resp-'+Date.now(),titulo:c.q.slice(0,70),cuerpo:`# ${c.q}\n\n${c.a}`,orden:80});if(r)status('Guardado en Saber');return}
  if(t.dataset.bandejaResp){const c=S.chat[t.dataset.bandejaResp];await nuevo('nota',{texto:`${c.q}\n\n${c.a}`,origen:'Claude',archivada:false});status('Mandado a la bandeja');return}
});

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.pf){const f=el.closest('[data-fecha]').dataset.fecha;const p=posteo(f);const v=el.value.trim();if(v===(p[el.dataset.pf]??''))return;
    return porClave('posteo',f,{marca:p.marca,aCargo:p.aCargo,fecha:f,[el.dataset.pf]:v},vistoAntes('posteo',f,[el.dataset.pf]))}
  if(el.dataset.uf){const s=el.closest('[data-ugc]');return porClave('ugc',s.dataset.ugc,{mes:s.dataset.ugc.slice(0,7),quien:s.dataset.quien,marca:s.dataset.marca,[el.dataset.uf]:el.value.trim()})}
  if(el.dataset.act==='check'){const id=el.closest('.item').dataset.id;return cambiar(id,el.checked?{estado:'hecho',hechoEn:new Date().toISOString()}:{estado:'pendiente',hechoEn:null})}
  if(el.dataset.act==='texto'){const id=el.closest('.item').dataset.id;const v=el.value.trim();if(v&&v!==buscar(id)?.texto)cambiar(id,{texto:v});return}
  if(el.dataset.cf){const id=el.closest('tr').dataset.cid;return cambiar(id,{[el.dataset.cf]:el.value.trim()})}
  if(el.dataset.kf){const id=el.closest('tr').dataset.kid;const c={[el.dataset.kf]:el.value.trim()};if(el.dataset.kf==='rubro'&&['influencer','ugc'].includes(el.value)&&!buscar(id).estado)c.estado='encontrado';return cambiar(id,c)}
  if(el.dataset.if){const id=el.closest('[data-iid]').dataset.iid;return cambiar(id,{[el.dataset.if]:el.value})}
  if(el.id==='filtro-rubro'){S.filtroRubro=el.value;return render()}
  if(el.id==='filtro-idea'){S.filtroIdea=el.value;return render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('textarea.txt')){e.preventDefault();e.target.blur()}
  if(e.key==='Enter'&&e.target.closest('tr.nuevo')){e.preventDefault();$('nc-add').click()}
});

/* reporte: hoja A4 aparte, se descarga como PDF */
function abrirReporte(){window.open(`/reporte.html?rango=semana&lunes=${iso(S.vista==='calendario'?semana:lunes(new Date()))}`,'_blank')}

// "Escribiendo" = con el foco en un campo y habiendo tecleado hace menos de 15 s.
// Si el cursor quedó quieto en un campo, igual se traen los cambios del otro.
let ultimaTecla=0;
document.addEventListener('input',()=>{ultimaTecla=Date.now()});
function escribiendo(){const a=document.activeElement;return a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&Date.now()-ultimaTecla<15000}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.logueado&&!escribiendo())cargar().catch(()=>{})});
// Cada 30 s con la pestaña visible: así se ven los cambios de la otra persona. Con la pestaña oculta no consulta.
setInterval(()=>{if(!document.hidden&&S.logueado&&!escribiendo()&&!Object.values(S.busy).some(Boolean))cargar().catch(()=>{})},30000);
cargar().catch(()=>{S.logueado=false;render()});
</script>
