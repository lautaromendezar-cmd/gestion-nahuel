<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0B0C">
<title>Redes Latina | Centenaria</title>
<link rel="icon" href="/img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<style>
/* Layout: menú lateral negro fijo + área de trabajo gris clara; en el celular el menú pasa a una barra superior con navegación deslizable.
   El color está en las marcas (etiquetas Centenaria/LaTiNa/Cente Azul) y en los estados; lo demás es negro y gris. */
:root{
  --bg:#F3F3F4; --surface:#FFFFFF; --sunk:#EEEEF0; --fg:#141416; --fg2:#3A3B40; --muted:#6B6D74; --line:#E4E4E7;
  --accent:#141416; --accent-2:#2C2D31; --accent-soft:#E9E9EC; --accent-fg:#FFFFFF;
  --side:#0B0B0C; --side-fg:#C8C9CD; --side-muted:#85878E; --side-hover:#1C1C1F;
  --cente:#6B5600; --cente-bg:#FFF4C2; --cente-dot:#E9BE00;
  --latina:#0C5223; --latina-bg:#DDEFE2; --latina-dot:#1E8A44;
  --azul:#0B2F63; --azul-bg:#E1E9F5; --azul-dot:#2D6BC4;
  --wait:#A8460F; --wait-bg:#FDEBDD; --ok:#1F7A3A; --ok-bg:#E1F2E6; --doing:#1B5C8F; --doing-bg:#E0ECF7; --bad:#B42318; --bad-bg:#FDE7E5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);
  --font:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 var(--font)}
h1,h2,h3,h4{margin:0;letter-spacing:-.025em;text-wrap:balance;line-height:1.15}
h1{font-size:24px;font-weight:800}
h2{font-size:17px;font-weight:700}
h3{font-size:15px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* esqueleto */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--side) 252px,transparent 252px)}
.side{background:var(--side);color:var(--side-fg);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;gap:18px;overflow-y:auto}
.brand{display:grid;gap:10px;padding:0 8px}
.logos{display:flex;align-items:center;gap:10px}
.logos img{height:44px;width:auto;display:block}
.brand b{display:block;color:#fff;font-size:14px;letter-spacing:-.01em;line-height:1.3}
.brand b span{color:var(--side-muted);font-weight:500}
.navgrp{display:grid;gap:2px}
.navgrp .gl{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--side-muted);padding:6px 10px}
.nav{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--side-fg);padding:9px 10px;border-radius:9px;font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--side-hover)}
.nav[aria-current="page"]{background:#fff;color:var(--side);font-weight:700}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav .bd{margin-left:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 7px}
.nav .bd.alert{background:#E9BE00;color:#0B0B0C}
.nav[aria-current="page"] .bd{background:var(--sunk);color:var(--fg)}
.side-foot{margin-top:auto;display:grid;gap:8px;padding:0 4px}
.side-foot .btn{width:100%;justify-content:center}
.side .btn.primary,.topm .btn.primary{background:#fff;border-color:#fff;color:var(--side)}
.side .btn.primary:hover,.topm .btn.primary:hover{background:#E4E4E7}
.side .status{color:var(--side-muted);font-size:11.5px;padding:0 6px}
.main{min-width:0;padding:28px 32px 80px;display:grid;gap:22px;align-content:start;max-width:1320px;width:100%}
.topm{display:none}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head .sub{color:var(--muted);margin-top:4px}

/* piezas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;min-width:0;align-content:start}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.gauto{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;align-items:start}
.span2{grid-column:span 2}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;font-weight:600;font-size:13.5px;color:var(--fg)}
.btn:hover{border-color:#C9CACE}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{background:var(--accent-2)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.55;cursor:wait}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;font-size:17px}
.f{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 11px;min-width:0}
.f:focus{border-color:var(--fg2);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.f{width:100%;resize:vertical;line-height:1.5}
.empty{color:var(--muted);font-size:13.5px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--fg2);white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.wait{background:var(--wait-bg);color:var(--wait)} .chip.doing{background:var(--doing-bg);color:var(--doing)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.ghost{background:transparent;border-color:var(--line);color:var(--muted)}
button.chip{cursor:pointer}
.chip.del{background:transparent;color:var(--muted);padding:2px 7px}
.chip.del.armed{background:var(--bad);color:#fff}
.marca{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.marca::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.marca.centenaria{color:var(--cente);background:var(--cente-bg)} .marca.centenaria::before{background:var(--cente-dot)}
.marca.latina{color:var(--latina);background:var(--latina-bg)} .marca.latina::before{background:var(--latina-dot)}
.marca.cente-azul{color:var(--azul);background:var(--azul-bg)} .marca.cente-azul::before{background:var(--azul-dot)}
.marca.ambas{color:var(--fg2);background:var(--sunk)} .marca.ambas::before{background:var(--muted)}
.count{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}

/* KPI */
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:grid;gap:6px;min-width:0}
.kpi .v{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.kpi .v small{font-size:15px;color:var(--muted);font-weight:600}
.kpi .d{font-size:12.5px;color:var(--muted)}
.kpi.warn{border-color:#F3C9A6;background:linear-gradient(180deg,#FFF8F2,#fff)}
.bar{height:6px;border-radius:999px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.delta{font-size:12px;font-weight:700}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}

/* hoy */
.hero{background:linear-gradient(120deg,#0B0B0C 0%,#1C1C1F 60%,#2C2D31 100%);color:#fff;border-radius:16px;padding:22px 24px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.hero .label{color:#A9ABB1}
.hero h2{font-size:22px;font-weight:800;color:#fff;margin-top:6px}
.hero .tema{font-size:15px;color:#E4E4E7;margin-top:6px}
.hero .chk{display:grid;gap:8px;min-width:220px}
.hero .chk button{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:10px;padding:9px 12px;font-weight:600;text-align:left}
.hero .chk button[aria-pressed="true"]{background:#fff;color:var(--fg)}
.hero .chk .box{width:18px;height:18px;border-radius:5px;border:2px solid currentColor;display:grid;place-items:center;font-size:12px;flex:none}
.alerta{display:flex;gap:12px;align-items:flex-start;background:#FFF8E5;border:1px solid #F2DD9B;border-radius:12px;padding:14px 16px}
.alerta b{display:block}
.day{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:7px;background:var(--surface);min-width:0;text-align:left}
.day.hoy{border-color:var(--fg);box-shadow:0 0 0 3px var(--accent-soft)}
.day .dn{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .tt{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:2.6em}
.day .tt.no{color:var(--muted);font-weight:500}
.lst{list-style:none;margin:0;padding:0;display:grid}
.lst li{display:flex;gap:10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line)}
.lst li:first-child{border-top:0}
.lst .fr{font-size:11.5px;font-weight:600;color:var(--muted);min-width:9.5em;flex:none}

/* calendario */
.dia{border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.dia.hoy{border-color:var(--accent)}
.dia.publicado{border-color:#9ED3AE;background:linear-gradient(180deg,#F3FBF5,#fff)}
.dia-h{display:flex;justify-content:space-between;align-items:center;gap:6px}
.dia-h b{font-size:13px}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--sunk)}
.seg button{flex:1;border:0;background:transparent;padding:5px 4px;font-size:11.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.seg.est,.seg.ejes{display:grid;grid-template-columns:1fr 1fr}
.seg.est button.on{background:var(--accent);color:#fff}
.dia textarea.f{font-size:13px;min-height:62px}
.redes{display:flex;gap:6px;flex-wrap:wrap}
.redes button{border:1px solid var(--line);background:var(--surface);border-radius:7px;font-size:11.5px;font-weight:700;padding:3px 8px;color:var(--muted)}
.redes button[aria-pressed="true"]{background:var(--ok-bg);border-color:#9ED3AE;color:var(--ok)}
.fch{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:7px;padding:2px 7px;background:var(--doing-bg);color:var(--doing);max-width:100%}
.fch.comercial{background:#FDEFD9;color:#8A4B06}
.fch.evento{background:var(--ok-bg);color:var(--ok)}
.fch.puente{background:var(--sunk);color:var(--fg2)}
.fchs{display:flex;flex-wrap:wrap;gap:4px}
.flist{list-style:none;margin:0;padding:0;display:grid}
.flist li{display:grid;grid-template-columns:5.2em minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.flist li:first-child{border-top:0}
.flist .fd{font-weight:700;font-size:12.5px}
.flist .fq{font-size:11.5px;color:var(--muted)}
.ugc-slot{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}

/* grilla del mes */
.seg.calv{background:var(--sunk)}
.seg.calv button{padding:6px 14px;font-size:12.5px}
.mes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) repeat(2,minmax(0,.5fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.mes .dh{background:#FAFBFA;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px}
.mc{background:var(--surface);border:0;border-top:3px solid transparent;text-align:left;padding:7px 9px 9px;min-height:128px;display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0;color:var(--fg)}
button.mc:hover{background:#FAFBFA}
.mc.centenaria{border-top-color:var(--cente-dot)} .mc.latina{border-top-color:var(--latina-dot)} .mc.cente-azul{border-top-color:var(--azul-dot)}
.mc.publicado{background:linear-gradient(180deg,#F3FBF5,#fff)}
.mc.finde{background:#F8FAF8}
.mc.fuera>*{opacity:.4}
.mc-h{display:flex;align-items:center;gap:6px}
.mc-n{font-size:12px;font-weight:700;min-width:24px;height:24px;border-radius:999px;display:grid;place-items:center;margin-left:-4px;color:var(--fg2)}
.mc.hoy .mc-n{background:var(--accent);color:#fff}
.mc-d{display:none;font-size:12px;font-weight:600;color:var(--muted)}
.mc .marca{font-size:11px;padding:2px 7px}
.mc-t{font-size:12.5px;font-weight:600;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;max-width:100%}
.mc-t.no{color:var(--muted);font-weight:500}
.mc .fch{font-size:10.5px;padding:1px 6px}
.mc-pie{margin-top:auto;gap:4px}
.mc-pie .chip{font-size:11px;padding:1px 7px}
/* barra superior: quién está conectado y salir */
.topbar{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:16px;height:60px;padding:0 32px;background:rgba(243,243,244,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar .status{font-size:12px;color:var(--muted)}
.usr{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--fg);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.usr-t{display:grid;line-height:1.2;margin-right:6px}
.usr-t b{font-size:13.5px}
.usr-t span{font-size:11.5px;color:var(--muted)}
.usr-m{display:none}

/* avisos */
#avisos{position:fixed;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;flex-direction:column;width:min(380px,calc(100% - 32px));pointer-events:none}
/* cada aviso va en un envoltorio que se pliega al salir, así los de arriba bajan suave */
.aviso-w{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s cubic-bezier(.2,.8,.2,1)}
.aviso-w>div{min-height:0;overflow:hidden;padding:12px 28px 30px;margin:-4px -28px -30px}
.aviso-w.sale{grid-template-rows:0fr}
.aviso{position:relative;overflow:hidden;pointer-events:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:11px;align-items:center;background:#141416;color:#fff;border-radius:12px;padding:11px 8px 11px 14px;font-size:13px;font-weight:600;line-height:1.4;box-shadow:0 1px 2px rgba(0,0,0,.2),0 8px 20px rgba(0,0,0,.2);
  animation:aviso-entra .34s cubic-bezier(.2,.9,.25,1.15) both}
.aviso-w.sale .aviso{animation:aviso-sale .24s ease-in both}
@keyframes aviso-entra{from{opacity:0;transform:translateX(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes aviso-sale{to{opacity:0;transform:translateX(36px)}}
.aviso-i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:rgba(255,255,255,.14);flex:none}
.aviso-i.pop{animation:aviso-pop .32s cubic-bezier(.2,.9,.3,1.4)}
@keyframes aviso-pop{from{transform:scale(.4)}to{transform:none}}
/* barrita que muestra cuánto falta para que se cierre solo */
.aviso-b{position:absolute;left:0;bottom:0;height:2px;width:100%;background:rgba(255,255,255,.35);transform-origin:left;animation:aviso-tiempo linear forwards}
@keyframes aviso-tiempo{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.aviso:hover .aviso-b{animation-play-state:paused}
.aviso.ok .aviso-i{background:#2F8A4E}
.aviso.error{background:#7A1A12} .aviso.error .aviso-i{background:#B42318}
.aviso.conflicto{background:#7A3A0C} .aviso.conflicto .aviso-i{background:#C2570F}
.aviso.info .aviso-i{background:#1B5C8F}
.aviso-x{border:0;background:transparent;color:rgba(255,255,255,.7);font-size:18px;width:30px;height:30px;border-radius:8px}
.aviso-x:hover{background:rgba(255,255,255,.12);color:#fff}
@media (max-width:900px){#avisos{right:12px;left:12px;width:auto;bottom:calc(12px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:reduce){.aviso,.aviso-w.sale .aviso{animation:aviso-fundido .2s both}.aviso-w.sale .aviso{animation-direction:reverse}.aviso-w{transition:none}.aviso-i.pop{animation:none}}
@keyframes aviso-fundido{from{opacity:0}to{opacity:1}}

/* semana: alertas, tareas compartidas, próximos eventos, detalle */
.alertas{background:#FFF8EC;border:1px solid #F1DCB4;border-radius:14px;padding:14px 18px;display:grid;gap:8px}
.alertas h2{font-size:14px}
.alertas ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.alertas li{position:relative;padding-left:16px;font-size:13.5px;line-height:1.45}
.alertas li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;border-radius:50%;background:var(--wait)}
.alertas li.tarde::before{background:var(--bad)} .alertas li.cerca::before{background:var(--doing)} .alertas li.tema::before{background:#B58A00}
.evlink{border:0;background:none;padding:0;font:inherit;font-weight:700;color:var(--fg);text-decoration:underline;text-decoration-color:#C9CACE;text-underline-offset:3px;cursor:pointer;text-align:left}
.evlink:hover{text-decoration-color:currentColor}
.evlink.sm{font-weight:600;color:var(--fg2)}
.av.sm{width:26px;height:26px;font-size:12px}
.pasos{list-style:none;margin:0;padding:0;display:grid}
.paso{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:start;padding:9px 4px;border-top:1px solid var(--line)}
.pasos .paso:first-child{border-top:0}
.paso input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--fg)}
.paso-t{display:grid;gap:2px;font-size:13.5px;line-height:1.4}
.paso-m{font-size:11.5px;color:var(--muted)}
.paso-m .tarde{color:var(--bad);font-weight:600}
.paso.hecho .paso-t>span:first-child{color:var(--muted);text-decoration:line-through}
.paso .quien{padding:3px 6px;font-size:12px;border-color:transparent;background:var(--sunk)}
.nuevo-paso{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:8px;align-items:center}
.nuevo-paso:not(:has(select+select)){grid-template-columns:minmax(0,1fr) auto auto auto}
.proxs{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.prox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);color:var(--fg)}
button.prox:hover{border-color:#C9CACE}
.prox.cerca{border-color:var(--fg);box-shadow:0 0 0 3px var(--accent-soft)}
.prox-n{display:grid;justify-items:center;min-width:46px;padding:6px 4px;border-radius:10px;background:var(--sunk);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.prox-n b{font-size:22px;letter-spacing:-.03em;color:var(--fg);text-transform:none;line-height:1.1}
.prox.cerca .prox-n{background:var(--fg);color:#C8C9CD} .prox.cerca .prox-n b{color:#fff}
.prox-t{display:grid;gap:4px;justify-items:start;min-width:0}
.prox-t b{font-size:14px;line-height:1.3}
.prog{display:grid;gap:4px;width:100%;margin-top:2px}
.prog .bar i{background:var(--ok)}
#modal-ev .modal{align-items:start;overflow-y:auto;padding:6vh 16px}
#modal-ev .modal.entra{animation:fundido .18s ease-out}
.ev-sheet{background:var(--surface);border-radius:16px;width:min(680px,100%);padding:22px;display:grid;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.entra .ev-sheet{animation:sube .24s cubic-bezier(.2,.8,.2,1)}
.evd-tit{font-size:20px;font-weight:800;letter-spacing:-.02em;border-color:transparent;padding-left:0}
.evd-tit:hover{border-color:var(--line);padding-left:11px}
.evd-tit:focus{padding-left:11px}
.copybtn{display:grid;gap:2px;text-align:left;border:1px dashed var(--line);background:transparent;border-radius:9px;padding:6px 10px;font-size:12px;color:var(--muted);min-width:0}
.copybtn:hover{border-color:#C9CACE;color:var(--fg2)}
.copybtn.tiene{border-style:solid;background:var(--bg)}
.copybtn b{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--fg2)}
.copybtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-txt{font-size:14px;min-height:240px}
.plantillas{display:grid;gap:8px;background:var(--bg);border-radius:12px;padding:12px 14px}
.btn.peligro{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes fundido{from{opacity:0}}
@keyframes sube{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){#modal-ev .modal.entra,.entra .ev-sheet{animation:none}}

.hist-li{display:grid!important;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.hist-q{font-size:12px;font-weight:700;min-width:6.5em}
.hist-t{display:grid;gap:2px;font-size:13.5px;min-width:0}
@media (max-width:900px){.hist-li{grid-template-columns:minmax(0,1fr) auto}.hist-li>.hist-q,.hist-li>.chip{grid-column:1/-1}}

/* tareas */
.items{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:7px 6px;border-radius:8px}
.item:hover{background:var(--bg)}
.item input[type=checkbox]{width:17px;height:17px;margin:2px 0 0;accent-color:var(--accent)}
.item .txt{border:0;background:transparent;width:100%;padding:0;resize:none;line-height:1.45;overflow:hidden;field-sizing:content;min-height:1.45em}
.item.hecho .txt{color:var(--muted);text-decoration:line-through}
.acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.when{font-size:11.5px;color:var(--muted)}
.add{display:flex;gap:6px}
.add input{flex:1;min-width:0;border:1px dashed #CDCED2;background:transparent;border-radius:9px;padding:8px 10px}
.toggle-done{border:0;background:transparent;color:var(--muted);font-size:13px;padding:2px 0;text-align:left;font-weight:600}
.espera{background:linear-gradient(180deg,#FFF7F0,#fff);border-color:#F3D3BA}

/* tablas */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);background:#FAFBFA}
td input,td select{border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 6px;width:100%}
td input:hover,td select:hover,td input:focus,td select:focus{border-color:var(--line);background:#fff}
td.n input{text-align:right;font-variant-numeric:tabular-nums}
td.calc{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
tr.nuevo td{background:#FAFBFA}
.wa{font-size:12px;font-weight:600;white-space:nowrap}

/* gráficos */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--font);fill:var(--muted);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.08}
.chart .pt{fill:var(--accent);stroke:#fff;stroke-width:2}
.chart .hit{fill:transparent;cursor:default}
.chart .bar-own{fill:var(--accent)}
.chart .bar-oth{fill:#C4C6CB}
.chart .vl{fill:var(--fg2);font-weight:600}
.spark{width:100%;height:36px;display:block}
.spark .ln{fill:none;stroke:var(--accent);stroke-width:2}
.spark .ar{fill:var(--accent);opacity:.1}
.spark .pt{fill:var(--accent)}
#tip{position:fixed;z-index:30;pointer-events:none;background:#141416;color:#fff;font-size:12px;font-weight:600;padding:6px 9px;border-radius:7px;white-space:pre;box-shadow:0 6px 16px rgba(0,0,0,.18)}

/* ideas, docs */
.idea{display:grid;gap:8px}
.idea p{font-size:13.5px;color:var(--fg2)}
.idea .porque{color:var(--muted);font-size:12.5px}
.idea.usada,.idea.descartada{opacity:.6}
.doc{line-height:1.65;max-width:80ch;color:var(--fg2)}
.doc h1{font-size:24px;margin:0 0 .5em;color:var(--fg)} .doc h2{font-size:18px;margin:1.5em 0 .5em;color:var(--fg)} .doc h3{margin:1.2em 0 .4em;color:var(--fg)}
.doc table{min-width:0;font-size:13px;margin:.8em 0;border:1px solid var(--line);border-radius:8px} .doc td,.doc th{border-bottom:1px solid var(--line)}
.doc code{font-size:12.5px;background:var(--sunk);padding:1px 5px;border-radius:5px}
.doc blockquote{margin:.8em 0;padding:.3em 1em;border-left:3px solid var(--line);color:var(--muted)}
.doc-wrap{overflow-x:auto}
.docs{display:grid;grid-template-columns:250px minmax(0,1fr);gap:20px;align-items:start}
.doclist{display:grid;gap:2px;position:sticky;top:20px}
.doclist button{border:0;background:transparent;text-align:left;padding:8px 11px;border-radius:9px;color:var(--fg2);font-weight:500}
.doclist button:hover{background:var(--surface)}
.doclist button[aria-current="true"]{background:var(--surface);color:var(--fg);font-weight:700;box-shadow:var(--shadow)}
.pre{white-space:pre-wrap;font-size:13.5px;line-height:1.6;color:var(--fg2)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

/* modal y login */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:16px;width:min(720px,100%);max-height:calc(100% - 32px);display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.sheet textarea{width:100%;height:100%;min-height:320px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:14px;font:13px/1.55 ui-monospace,Consolas,monospace;resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:16px;font-size:13.5px;color:var(--fg2)}
.login{min-height:100vh;display:grid;place-items:center;padding:16px;background:radial-gradient(1200px 600px at 20% 0%,#FFFFFF,transparent),var(--bg)}
.login .logos{justify-content:center;gap:14px}
.login .logos img{height:56px}
.login h1{font-size:19px;text-align:center}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:30px;display:grid;gap:14px;width:min(360px,100%);box-shadow:var(--shadow)}
.login input{font-size:24px;font-weight:700;letter-spacing:.35em;text-align:center}
.spin{display:inline-block;width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px}
@keyframes g{to{transform:rotate(360deg)}}

@media (max-width:1180px){.g5{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:1fr;background:var(--bg)}
  .calnav{flex:1 1 100%}
  .calnav b{min-width:0!important;flex:1}
  .side{display:none}
  .topm{display:grid;gap:10px;position:sticky;top:0;z-index:10;background:var(--side);color:#fff;padding:12px 16px 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .topm .row b{font-size:14.5px}
  .topbar{display:none}
  .usr-m{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--side-fg);background:var(--side-hover);border-radius:10px;padding:6px 6px 6px 8px}
  .usr-m b{color:#fff}
  .usr-m .av{width:26px;height:26px;font-size:12px;background:#fff;color:var(--side)}
  .usr-m>span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .salir-m{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;font-weight:600;font-size:12.5px;border-radius:8px;padding:6px 12px}
  .topm .logos img{height:28px}
  .topm nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px 10px}
  .topm nav::-webkit-scrollbar{display:none}
  .topm .nav{width:auto;white-space:nowrap;padding:7px 11px}
  .topm .nav svg{display:none}
  .main{padding:18px 16px 110px}
  .g2,.g3,.docs,.hero{grid-template-columns:1fr}
  .g5{grid-template-columns:1fr}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .span2{grid-column:auto}
  .doclist{position:static;grid-auto-flow:column;overflow-x:auto}
  .lst .fr{min-width:0}
  .lst li{flex-wrap:wrap;gap:2px 10px}
  .item{grid-template-columns:auto minmax(0,1fr)}
  .item .acts{grid-column:2;justify-content:flex-start}
  .head>div{flex:1 1 100%}
  .nuevo-paso,.nuevo-paso:not(:has(select+select)){grid-template-columns:1fr 1fr}
  .nuevo-paso>input:first-child{grid-column:1/-1}
  .paso{grid-template-columns:auto minmax(0,1fr) auto}
  .paso .quien{grid-column:2;justify-self:start}
  .mes{grid-template-columns:1fr}
  .mes .dh,.mc.fuera,.mc.finde:not(.confecha){display:none}
  .mc{min-height:0;flex-direction:row;flex-wrap:wrap;align-items:center;border-top:0;border-left:4px solid transparent}
  .mc.centenaria{border-left-color:var(--cente-dot)} .mc.latina{border-left-color:var(--latina-dot)} .mc.cente-azul{border-left-color:var(--azul-dot)}
  .mc-h{min-width:7.5em}
  .mc-d{display:inline}
  .mc-t{flex:1 1 100%;-webkit-line-clamp:2}
  .mc-pie{margin-top:0}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
